version: "2.0"
dataset_version: "2.0"
review_status: approved

parents:
  produce:
    kind: merchandise
    description: >-
      Fresh fruit and vegetables, whole or minimally cut. Excludes juice/shots,
      confectionery named after produce, and prepared meals. A generic
      fruit/vegetable department label supports this parent only.
    leaves:
      fruit: Fresh fruit including citrus; exact fruit variety need not be known. Excludes juice and confectionery.
      vegetables: Fresh vegetables including roots; excludes vegetable drinks and prepared meals.
  grains:
    kind: merchandise
    description: >-
      Bread, bakery products and uncooked cereal-based staples. Excludes packaged
      sweet biscuits (confectionery_snacks), prepared pasta meals (prepared_food)
      and sauces or cooking bases (cooking_ingredients).
    leaves:
      bread_bakery: Bread, rolls and pastries; excludes packaged sweet biscuits.
      dry_staples: Uncooked rice, pasta and breakfast cereals; excludes prepared meals.
  dairy_eggs:
    kind: merchandise
    description: >-
      Animal milk/cream, yogurt/quark, cheese and shell eggs. Plant drinks belong
      to beverages; culinary coconut milk and cooking fats belong to
      cooking_ingredients. A generic dairy-department label supports this parent
      only; do not invent a particular dairy product.
    leaves:
      milk_cream: Plain animal milk and cream; excludes plant drinks, culinary coconut milk and cooking fats.
      yogurt_quark: Yogurt and quark; excludes milk/cream and cheese.
      cheese: Cheese including fresh cheese; excludes yogurt and quark.
      eggs: Shell eggs; excludes prepared egg dishes.
  meat_fish:
    kind: merchandise
    description: >-
      Meat, poultry, sausage, cold cuts, fish and seafood. Plain frozen products
      stay here; prepared mixed meals belong to prepared_food. Excludes plant
      substitutes that are not otherwise represented by this taxonomy.
    leaves:
      meat_sausage: Meat, poultry, sausage and cold cuts; excludes fish and prepared mixed meals.
      fish_seafood: Fish and seafood including plain frozen fillets; excludes prepared mixed meals.
  confectionery_snacks:
    kind: merchandise
    description: >-
      Confectionery, packaged sweet biscuits and savory snacks. Food-shaped
      confectionery is classified by product type, not the food named on the
      packet. Excludes bread/pastries and frozen potato side dishes or meals.
    leaves:
      confectionery: Gummy sweets, sour sweets, chocolate and other confectionery; excludes sweet biscuits and savory snacks.
      sweet_biscuits: Packaged sweet biscuits and filled sandwich biscuits; excludes fresh pastries and confectionery without a biscuit base.
      savory_snacks: Chips, crisps and shaped savory snack products; excludes frozen fries and other cookable potato sides.
  prepared_food:
    kind: merchandise
    description: >-
      Prepared meals, soups and cookable prepared potato side dishes, whether
      frozen, chilled or shelf-stable. Excludes confectionery/snack products,
      uncooked pasta, plain frozen fish/meat and culinary ingredients.
    leaves:
      potato_sides: Frozen fries and other prepared cookable potato sides; excludes snack crisps and potato-based mixed meals.
      meals_soups: Prepared mixed meals and soups, including lasagne; excludes standalone potato sides and cooking bases.
  cooking_ingredients:
    kind: merchandise
    description: >-
      Cooking oils/fats, sauces, seasonings and culinary cooking bases, including
      conventional culinary coconut milk. Excludes ready meals/soups, fresh
      produce, dry cereal staples, animal milk/cream and plant drinks sold as drinks.
    leaves:
      oils_fats: Cooking oils, butter and margarine; excludes milk and cream.
      sauces_bases_seasonings: Sauces, seasonings and culinary bases including culinary coconut milk; excludes complete soups and plant drinks.
  beverages:
    kind: merchandise
    description: >-
      Water, soft drinks, juices/shots, plant drinks, coffee, tea and alcoholic
      drinks. Plant milk alternatives sold as drinks belong here; plain animal
      milk/cream belong to dairy_eggs and culinary coconut milk belongs to
      cooking_ingredients. A generic drinks-department label supports this parent only.
    leaves:
      water_soft_drinks: Water and soft drinks; excludes juices/shots, plant drinks and alcoholic drinks.
      juice_shots: Fruit/vegetable juices and small juice or ginger shots; excludes whole produce and plant milk alternatives.
      plant_drinks: Plant milk alternatives sold as drinks, such as oat drink; excludes animal milk and culinary coconut milk.
      coffee_tea: Coffee beans, ground or instant coffee, and dry tea; excludes ready-to-drink products.
      alcoholic: Alcoholic drinks; excludes nonalcoholic counterparts.
  household:
    kind: merchandise
    description: >-
      Household wares and supplies, with kitchenware and household cleaners as
      supported leaves. A generic household-wares label supports only this parent.
      Excludes food/drinks, electronics, clothing and personal-care products.
      A scent such as citrus on a cleaner does not make it produce.
    leaves:
      kitchenware: Cookware and kitchen utensils; an unclear pan-versus-pot abbreviation can still support this leaf. Excludes electronic accessories.
      cleaning_supplies: Household cleaners and cleaning implements; excludes personal-care products and edible products.
  adjustments:
    kind: receipt_adjustment
    description: >-
      Explicit non-merchandise receipt adjustments: deposit charges, deposit
      returns and discounts. Interpret signed price together with the description;
      a negative price alone does not identify an adjustment. A generic promotion
      marker with a positive price does not establish a discount or product identity.
    leaves:
      deposit_charge: Explicit deposit line with a positive charge; excludes the underlying beverage or container merchandise.
      deposit_return: Explicit returned-deposit or empties line with a negative credit; excludes ordinary merchandise returns.
      discount: Explicit coupon or discount deduction; excludes an unspecified promotion marker and ordinary merchandise returns.

decision_options:
  unidentifiable:
    outcome: abstention
    flat_description: >-
      No specific supported leaf is justified by raw_text, price and merchant_type.
      This includes wholly unidentifiable lines and cases where only a parent is
      identifiable: this flat question has no parent-only answer. Do not guess a
      leaf from price, merchant type or typical product frequency. Do not use this
      for an identifiable item outside every supported parent; use out_of_scope.
    description: >-
      The available raw_text, price and merchant_type do not justify any supported
      parent or an identifiable item outside the taxonomy. Opaque article numbers
      and unspecified miscellaneous/promotion lines belong here. Do not infer an
      identity from price or merchant type alone. If a parent is justified but its
      leaf is unknown, choose that parent instead. Do not use this for a clearly
      identifiable item outside the supported categories.
  out_of_scope:
    outcome: scope_rejection
    flat_description: >-
      The item or adjustment is identifiable but no supported parent applies,
      such as an electronic cable, clothing or an ordinary merchandise return.
      Do not use this merely because a supported parent's particular leaf is
      unknown; choose unidentifiable for insufficient leaf-level information.
    description: >-
      The item or adjustment is identifiable, but no supported parent applies;
      for example an electronic cable, clothing or an ordinary merchandise-return
      adjustment. This asserts known exclusion, not missing information. If a
      supported parent is justified, choose it even when no leaf is known. If the
      item itself cannot be identified enough to establish exclusion, choose
      unidentifiable instead.

child_decision_options:
  unspecified_child:
    outcome: retain_parent
    description: >-
      The selected parent is the available classification, but the receipt
      evidence does not justify any particular child of that parent. Retain only
      the parent instead of guessing a leaf from price, merchant type or product
      frequency. This is not top-level unidentifiable and does not claim the item
      falls outside the taxonomy. It adds no finer product identity.

special_labels:
  insufficient_information: INSUFFICIENT_INFORMATION
  parent_only: PARENT_ONLY
  out_of_scope: OUT_OF_SCOPE
